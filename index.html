    <title>Redirecting... | Harbour & Hills</title>

    <script type="text/javascript">
        (function() {
            var target = 'hk/index.html';

            // India, Canada and the USA get their own site; everyone else,
            // Hong Kong included, lands on HK (head office).
            // Deliberately timezone-only: a locale check would send a
            // rest-of-world visitor on a US-English machine to the USA site.
            var IN = ['asia/kolkata', 'asia/calcutta'];

            var CA = ['america/toronto', 'america/vancouver', 'america/edmonton',
                'america/winnipeg', 'america/halifax', 'america/st_johns',
                'america/montreal', 'america/regina', 'america/swift_current',
                'america/whitehorse', 'america/dawson', 'america/dawson_creek',
                'america/fort_nelson', 'america/creston', 'america/inuvik',
                'america/yellowknife', 'america/cambridge_bay', 'america/rankin_inlet',
                'america/resolute', 'america/iqaluit', 'america/pangnirtung',
                'america/atikokan', 'america/coral_harbour', 'america/thunder_bay',
                'america/nipigon', 'america/rainy_river', 'america/moncton',
                'america/goose_bay', 'america/glace_bay', 'america/blanc-sablon'];

            var US = ['america/new_york', 'america/chicago', 'america/denver',
                'america/los_angeles', 'america/phoenix', 'america/anchorage',
                'america/juneau', 'america/sitka', 'america/nome', 'america/adak',
                'america/yakutat', 'america/metlakatla', 'america/detroit',
                'america/boise', 'america/menominee', 'america/shiprock',
                'america/puerto_rico', 'pacific/honolulu', 'pacific/guam',
                'pacific/pago_pago', 'pacific/saipan'];

            // Whole families of zones, plus the legacy aliases Windows still ships
            var PREFIX = [
                ['america/indiana/', 'us/index.html'],
                ['america/kentucky/', 'us/index.html'],
                ['america/north_dakota/', 'us/index.html'],
                ['us/', 'us/index.html'],
                ['canada/', 'ca/index.html'],
                ['asia/kolkata', 'in/index.html']
            ];

            try {
                // Timezone detection (synchronous & instant, 0ms)
                var tz = (Intl && Intl.DateTimeFormat) ? Intl.DateTimeFormat().resolvedOptions().timeZone : '';
                if (tz) {
                    tz = tz.toLowerCase();
                    if (IN.indexOf(tz) !== -1) {
                        target = 'in/index.html';
                    } else if (CA.indexOf(tz) !== -1) {
                        target = 'ca/index.html';
                    } else if (US.indexOf(tz) !== -1) {
                        target = 'us/index.html';
                    } else {
                        for (var i = 0; i < PREFIX.length; i++) {
                            if (tz.indexOf(PREFIX[i][0]) === 0) {
                                target = PREFIX[i][1];
                                break;
                            }
                        }
                    }
                }
            } catch(e) {}

            // Instant client-side redirect (0ms)
            window.location.replace(target);
        })();
    </script>
